name: Download counts

# Renders the three README badges: total downloads, downloads this month, and
# roughly how many installs are running.
#
# GitHub reports one cumulative download counter per release asset and no
# history, so "downloads this month" cannot be read from the API. This job
# snapshots the running total once a day under `.github/download-counts` on `main` and serves
# the 30-day delta between snapshots as a shields.io endpoint.
#
# Only app artifacts count. Summing *every* asset counts the update feed, and
# electron-updater re-fetches latest-mac.yml off the newest release every four
# minutes: a single running install produced ~1000 of those per long-lived
# release, and 7396 of the first 7430 "downloads" were feed and blockmap
# fetches rather than anyone getting the app. That is why shields.io's own
# github/downloads/:repo/total badge cannot be used here.
#
# Read the total as a floor. GitHub counts a download only for a full-file
# request: a Range request returns 206 and leaves the counter alone (verified
# against a release asset), and electron-updater fetches the .blockmap and then
# range-requests the archive whenever a blockmap is published -- which is every
# release here. So auto-updates to existing installs are invisible to this
# number, and `gh release upload --clobber` resets an asset's counter when a
# release is republished (16 installer assets so far). What the badge does
# report honestly is full downloads: new installs and anything that could not
# take the differential path.
on:
  schedule:
    # 07:11 UTC, off the hour so it does not queue behind the rush.
    - cron: "11 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-counts
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Snapshot downloads and render the badges
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UPDATES_ORIGIN: https://updates.mtcode.munimtech.com
        run: |
          set -euo pipefail

          mkdir -p .github/download-counts
          cd .github/download-counts

          # `gh --paginate` with `--jq` runs the filter once per page, so emit
          # one release per line and slurp the pages back into one array.
          gh api "repos/$REPO/releases?per_page=100" --paginate --jq '.[]' \
            | jq -s '.' > releases.json

          github_total=$(jq '[.[].assets[]
                              | select(.name | test("\\.(dmg|zip|exe|AppImage|deb|rpm)$"))
                              | .download_count] | add // 0' releases.json)

          # infra/updates counts what GitHub cannot see. The two populations do
          # not overlap: a client reads exactly one feed, so installs that still
          # point at GitHub are counted there and everything on the Worker feed
          # is counted here. Summing is correct, including mid-migration. A
          # Worker that cannot be reached contributes zero rather than failing
          # the badge.
          curl -fsS --max-time 20 "$UPDATES_ORIGIN/stats" > worker-stats.json \
            || echo '{"deliveries":0,"deliveriesLast30Days":0,"activeInstalls":0}' > worker-stats.json
          worker_deliveries=$(jq '.deliveries // 0' worker-stats.json)
          worker_active=$(jq '.activeInstalls // 0' worker-stats.json)

          total=$((github_total + worker_deliveries))
          today=$(date -u +%Y-%m-%d)
          echo "github=$github_total worker=$worker_deliveries total=$total on $today"

          [ -f history.json ] || echo '[]' > history.json

          # One snapshot per day, and the last 400 kept: enough for a year of
          # 30-day windows without the file growing without bound.
          jq --arg date "$today" --argjson total "$total" '
            (map(select(.date != $date)) + [{date: $date, total: $total}])
            | sort_by(.date)
            | .[-400:]
          ' history.json > history.next.json
          mv history.next.json history.json

          # The oldest snapshot at least 30 days old is the baseline; before one
          # exists the window is short, so the badge says so rather than
          # reporting a month it has not measured yet.
          #
          # A negative delta means the snapshots on either side of the window
          # were not counting the same thing -- change which assets `total`
          # selects and every older entry becomes incomparable. Reset
          # history.json in the same commit when that happens; the clamp below
          # only keeps the badge from publishing a nonsense number meanwhile.
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-30d +%Y-%m-%d)
          jq -r --arg cutoff "$cutoff" --arg today "$today" --argjson total "$total" '
            (map(select(.date <= $cutoff)) | last) as $baseline
            | if $baseline then
                { measured: true, downloads: ($total - $baseline.total) }
              else
                { measured: false, downloads: ($total - (.[0].total // $total)),
                  since: (.[0].date // $today) }
              end
            | if .downloads < 0 then
                { measured: false, downloads: 0, since: $today }
              else . end
          ' history.json > window.json

          # Until 30 days of snapshots exist this is the delta over however
          # much history there is, which is the most the API can support --
          # GitHub keeps no download history to backfill from.
          monthly=$(jq -r '.downloads' window.json)

          jq -n --argjson monthly "$monthly" '
            { schemaVersion: 1, label: "Monthly Downloads",
              message: ($monthly | tostring), color: "33CC12", labelColor: "gray" }
          ' > downloads-monthly.json

          jq -n --argjson total "$total" '
            { schemaVersion: 1, label: "Total Downloads",
              message: ($total | tostring), color: "0066CC", labelColor: "gray" }
          ' > downloads-total.json

          # How many copies are actually running. Nothing reports that, but the
          # updater polls the feed on the newest release every four minutes, so
          # a release's latest-mac.yml fetches divided by (hours it stayed
          # newest x 15) is how many installs were running in that window.
          # Take the median of the last ten releases that stayed newest long
          # enough to measure -- under about two hours a single stray fetch
          # invents a whole install. Ordering is by published_at: created_at is
          # the tagged commit's date, so two releases cut from one commit tie.
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          installs=$(jq --arg now "$now" '
            def at: (.published_at // .created_at) | fromdateiso8601;
            ([ .[] | select(.tag_name | startswith("munim-v")) ] | sort_by(at)) as $r
            | ($now | fromdateiso8601) as $nowSec
            | [ range(0; ($r | length)) as $i
                | $r[$i] as $rel
                | (if $i + 1 < ($r | length) then ($r[$i + 1] | at) else $nowSec end) as $end
                | (($end - ($rel | at)) / 3600) as $hours
                | select($hours >= 2)
                | ([ $rel.assets[] | select(.name == "latest-mac.yml") | .download_count ] | first) as $polls
                | select($polls != null)
                | $polls / ($hours * 15)
              ]
            | .[-10:] | sort
            | if length == 0 then 0
              elif (length % 2) == 1 then .[(length / 2) | floor]
              else ((.[(length / 2) - 1] + .[length / 2]) / 2)
              end
            | . * 10 | round / 10
          ' releases.json)
          echo "active installs=$installs"

          # Installs on the Worker feed are counted exactly; only the ones
          # still reading GitHub have to be estimated. Once every client has
          # updated past the feed switch, the estimate term goes to zero and
          # this badge is a measurement rather than a mix of the two.
          combined=$(jq -n --argjson w "$worker_active" --argjson e "$installs" '$w + $e')
          echo "active installs: worker=$worker_active github-estimate=$installs"

          jq -n --argjson combined "$combined" '
            { schemaVersion: 1, label: "Daily Active Users",
              message: ($combined | round | tostring),
              color: "9966CC", labelColor: "gray" }
          ' > active-installs.json

          rm -f releases.json window.json worker-stats.json
          git add history.json downloads-monthly.json downloads-total.json active-installs.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "chore: snapshot download counts for $today"
          git pull --rebase origin main
          git push -q "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" HEAD:main

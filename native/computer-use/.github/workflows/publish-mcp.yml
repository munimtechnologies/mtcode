name: Publish to MCP Registry

# The npm launcher (munim-computer-use) is published from a maintainer machine
# first; this job then registers the matching version with the official MCP
# Registry using GitHub OIDC for the io.github.munimtechnologies namespace.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must already exist on npm and Releases)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Set version in server.json
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          cat server.json
      - name: Validate
        run: ./mcp-publisher validate
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
